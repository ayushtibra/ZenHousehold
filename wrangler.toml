# Cloudflare Pages: serves the built PWA (dist) and runs functions/api/* for the sync API.
# Pages rather than a Worker because the office network blocks *.workers.dev but not *.pages.dev.
name = "zenhousehold"
compatibility_date = "2026-10-01"
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "zenhousehold"
database_id = "86664ef3-5b3c-44d0-89bf-e6d3b977941d"
migrations_dir = "migrations"
